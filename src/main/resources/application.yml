server:
  port: 8086
  servlet:
    contextPath: /finco-api/v1
  forward-headers-strategy: native

finco:
  frontend:
    url: ${FRONTEND_URL}
  # authco: public issuer (iss claim), internal URL (JWKS, userinfo) and finco audience
  security:
    issuer: ${AUTHCO_ISSUER}
    internal-url: ${AUTHCO_INTERNAL_URL:${AUTHCO_ISSUER}}
    resource-id: ${FINCO_RESOURCE_ID}
    scopes-supported: openid,profile,email,finco:premium

spring:
  application:
    name: finco
  datasource:
    url: jdbc:mysql://${DbUrl}/Finco?createDatabaseIfNotExist=true
    username: ${UserDb}
    password: ${password}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
  ai:
    openai:
      api-key: ${openai-key}
      chat:
        options:
          model: "gpt-5-mini"
          temperature: 1
          top-p: 1
    mcp:
      server:
        base-url: ${server.servlet.context-path}
        sse-endpoint: /sse
        sse-message-endpoint: /mcp/message
    chat:
      memory:
        repository:
          jdbc:
            initialize-schema: always

# configuration of logging
logging:
  level:
    '[com.finco.finco]': INFO
    '[org.springframework.web]': INFO
    '[org.hibernate.type.descriptor.sql.BasicBinder]': TRACE
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: logs/${spring.application.name}.log
  logback:
    rollingpolicy:
      max-file-size: 10MB
      max-history: 7

springdoc:
  default-produces-media-type: application/json
  default-consumes-media-type: application/json
  swagger-ui:
    operationsSorter: method

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
      show-components: never