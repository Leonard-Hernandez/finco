apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: finco

resources:
  - config/namespace.yml
  - config/configmap.yml
  - volumes/mysql-pv.yml
  - volumes/mysql-pvc.yml
  - volumes/postgres-pv.yml
  - volumes/postgres-pvc.yml
  - deploys/deployment-mysql.yaml
  - deploys/deployment-postgres.yaml
  - deploys/deployment-finco.yaml
  - deploys/deployment-authco.yaml
  - deploys/deployment-finco-site.yaml
  - services/service-mysql.yaml
  - services/service-postgres.yaml
  - services/service-finco.yaml
  - services/service-authco.yaml
  - services/service-finco-site.yaml
  - ingress/ingress.yaml
  - ingress/ingress-well-known.yaml

# Secrets are generated from git-ignored env files: copy each
# config/secrets/<name>.env.example to <name>.env and fill it in (see README).
# A missing file fails the build, so placeholders are never deployed.
secretGenerator:
  - name: finco-secret
    envs:
      - config/secrets/finco.env
  - name: mysql-secret
    envs:
      - config/secrets/mysql.env
  - name: postgres-secret
    envs:
      - config/secrets/postgres.env
  - name: authco-secret
    envs:
      - config/secrets/authco.env

# Deployments reference the secrets by fixed name.
generatorOptions:
  disableNameSuffixHash: true
