apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: finco
  name: finco
spec:
  replicas: 1
  selector:
    matchLabels:
      app: finco
  strategy: {}
  template:
    metadata:
      labels:
        app: finco
    spec:
      initContainers:
      - name: wait-for-mysql
        image: busybox:1.36
        command: ["sh", "-c", "until nc -z mysql 3306; do echo waiting for mysql; sleep 2; done"]
      containers:
      - image: leonard20/finco:latest
        imagePullPolicy: IfNotPresent
        name: finco
        ports:
        - containerPort: 8086
        env:
        - name: DbUrl
          valueFrom:
            configMapKeyRef:
              name: finco
              key: db_url
        - name: UserDb
          valueFrom:
            secretKeyRef:
              name: finco-secret
              key: username
        - name: password
          valueFrom:
            secretKeyRef:
              name: finco-secret
              key: password
        - name: FRONTEND_URL
          valueFrom:
            configMapKeyRef:
              name: finco
              key: frontend_url
        - name: openai-key
          valueFrom:
            secretKeyRef:
              name: finco-secret
              key: openai-key
        - name: AUTHCO_ISSUER
          valueFrom:
            configMapKeyRef:
              name: finco
              key: authco_issuer
        - name: AUTHCO_INTERNAL_URL
          valueFrom:
            configMapKeyRef:
              name: finco
              key: authco_internal_url
        - name: FINCO_RESOURCE_ID
          valueFrom:
            configMapKeyRef:
              name: finco
              key: finco_resource_id
        resources:
          requests:
            cpu: 250m
            memory: 512Mi
          limits:
            memory: 1Gi
        startupProbe:
          httpGet:
            path: /finco-api/v1/actuator/health
            port: 8086
          periodSeconds: 10
          failureThreshold: 30
        readinessProbe:
          httpGet:
            path: /finco-api/v1/actuator/health
            port: 8086
          periodSeconds: 10
          timeoutSeconds: 5
        livenessProbe:
          httpGet:
            path: /finco-api/v1/actuator/health
            port: 8086
          periodSeconds: 20
          timeoutSeconds: 5
          failureThreshold: 3
